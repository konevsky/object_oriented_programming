[tool.poetry]
name = "object-oriented-programming"
version = "0.1.0"
description = "OOP homework project"
authors = ["Николай <kon3vsky@gmail.com>"]
readme = "README.md"
package-mode = false
packages = []

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^5.0"
black = "^24.0"
mypy = "^1.0"
isort = "^5.0"
flake8 = "^7.0"
pylint = "^3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term"
